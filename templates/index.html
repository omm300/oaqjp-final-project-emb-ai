
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NLP - Emotion Detection</title>

    <link
        rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    >

    <style>
        body {
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            min-height: 100vh;
            padding: 40px 15px;
        }

        .main-card {
            max-width: 850px;
            margin: 30px auto;
            border: none;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .card-body {
            padding: 35px;
        }

        .center-heading {
            text-align: center;
            color: #243b55;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .form-label {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        #textToAnalyze {
            min-height: 50px;
            font-size: 1rem;
        }

        .analyze-btn {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background: #f4f7fb;
            border-left: 5px solid #4a69bd;
            border-radius: 8px;
            min-height: 65px;
            overflow-wrap: anywhere;
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #243b55;
        }

        .footer-text {
            text-align: center;
            color: #6c757d;
            font-size: 0.9rem;
            margin-top: 25px;
        }
    </style>

    <script src="{{ url_for('static', filename='mywebscript.js') }}" defer></script>
</head>

<body>
    <div class="container">
        <div class="card main-card">
            <div class="card-body">

                <h1 class="center-heading">
                    NLP - Emotion Detection
                </h1>

                <div class="form-group">
                    <label class="form-label" for="textToAnalyze">
                        Please enter the text to be analyzed
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="textToAnalyze"
                        placeholder="Example: I am very happy today"
                        autocomplete="off"
                    >
                </div>

                <button
                    type="button"
                    onclick="RunSentimentAnalysis()"
                    class="btn btn-primary analyze-btn"
                >
                    Run Sentiment Analysis
                </button>

                <div class="mt-4">
                    <h2 class="result-title">
                        Result of Emotion Detection
                    </h2>

                    <div
                        id="system_response"
                        class="result-box"
                        role="status"
                        aria-live="polite"
                    >
                        Your emotion analysis will appear here.
                    </div>
                </div>

                <p class="footer-text">
                    Powered by Watson NLP Emotion Detection
                </p>

            </div>
        </div>
    </div>
</body>
</html>
